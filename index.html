<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>주간 할일</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주간 할일">
<meta name="theme-color" content="#FBF3E2">
<link rel="apple-touch-icon" href="/notebook_navy_badge.png">
<link rel="icon" href="/notebook_navy_badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'LeeSeoyun';
    src: url('/LEESEOYUN.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --k-var:#2B5EA7;
    --k-fix:#A3352E;
    --paper:#FBF3E2;
    --paper-raised:#FFFDF7;
    --ink:#232A3D;
    --ink-soft:#52597A;
    --muted:#A89A80;
    --line:#E7D9C0;
    --rule:#2C3A66;
    --rule-soft:#E3E7F0;
    --red:#D6492F;
    --red-soft:#F7E1DA;
    --gold:#B9932F;
    --gold-soft:#F6ECD8;
    --coral:#B5533E;
    --coral-soft:#F3E4E0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'LeeSeoyun',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 16px 90px;
  }
  .app{ width:100%; max-width:600px; }

  header{
    margin-bottom:24px; padding-bottom:14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    border-bottom:3px double var(--rule);
  }
  h1{
    font-family:'Noto Serif KR',serif; font-size:27px; font-weight:900; letter-spacing:-0.01em;
    margin:0 0 4px; color:var(--red);
  }
  .today-line{ font-size:13px; color:var(--ink-soft); font-weight:500; }
  .header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .icon-btn{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .sync-dot{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .sync-dot .dot{ width:6px; height:6px; border-radius:50%; background:var(--rule); }
  .sync-dot.offline .dot{ background:var(--coral); }
  .sync-dot.syncing .dot{ background:var(--gold); }

  .overdue-panel{
    background:var(--gold-soft);
    border:1px solid #E4D6A8;
    border-radius:12px;
    padding:14px 16px 6px;
    margin-bottom:26px;
  }
  .overdue-title{ font-size:13px; font-weight:650; color:#8A6A1E; margin-bottom:8px; }
  .overdue-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #E9DCB2; }
  .overdue-item:first-of-type{ border-top:none; }
  .overdue-text{ flex:1; min-width:0; font-size:16.5px; font-weight:500; line-height:1.4; }
  .overdue-meta{ display:block; font-size:12px; color:#93762C; margin-top:2px; font-weight:500; }
  .overdue-item select{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
    background:var(--paper-raised); border:1px solid var(--line); border-radius:7px;
    padding:6px 8px; max-width:118px; cursor:pointer;
  }
  .overdue-item .del{ flex-shrink:0; background:none; border:none; color:#93762C; cursor:pointer; padding:4px; border-radius:6px; opacity:.7; }

  .add-panel{ background:var(--paper-raised); border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:30px; }
  .add-panel input[type=text]{
    width:100%; font-family:inherit; font-size:16px; font-weight:500; padding:11px 4px;
    border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  .add-panel input[type=text]::placeholder{ color:var(--muted); font-weight:450; }
  .add-panel input[type=text]:focus{ border-bottom-color:var(--red); }
  .recur-toggle{
    display:block; width:100%; margin-top:10px; font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; cursor:pointer; text-align:center;
  }
  .recur-toggle.on{ background:var(--red-soft); border-color:var(--red); color:var(--red); }

  /* 반복 목록 칩 (작성 화면) */
  .recur-chips{ display:none; margin-top:10px; }
  .recur-chips.show{ display:block; }
  .recur-chips-label{ font-size:11.5px; font-weight:650; color:var(--muted); margin:0 0 6px 2px; }
  .chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; max-height:104px; overflow-y:auto; }
  .chip{
    font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chip.selected{ background:var(--red); border-color:var(--red); color:#fff; }
  .chip-empty{ font-size:12.5px; color:var(--muted); padding:2px; }

  .pill-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar{ display:none; }
  .pill{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:7px 11px;
    cursor:pointer; white-space:nowrap; transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .pill.today{ color:var(--red); }
  .pill.selected{ background:var(--red); border-color:var(--red); color:#fff; }

  .slot-row{ display:flex; gap:6px; align-items:center; }
  .slot-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  .slot-btn.selected{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .slot-fixed{ font-size:12.5px; font-weight:600; color:var(--muted); padding:7px 2px; }

  .add-btn{
    display:block; width:100%; margin-top:12px; font-family:inherit; font-size:14px; font-weight:650;
    color:#fff; background:var(--red); border:none; border-radius:8px; padding:11px; cursor:pointer;
  }
  .add-btn:active{ opacity:.85; }
  .add-btn:disabled{ opacity:.5; cursor:default; }

  .day-section{ margin-bottom:22px; }
  .day-header{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; padding-bottom:6px; border-bottom:1.5px solid var(--rule-soft); }
  .day-section.today .day-header{ border-bottom-color:var(--red); }
  .day-name{ font-family:'Noto Serif KR',serif; font-size:15.5px; font-weight:700; color:var(--rule); }
  .day-section.today .day-name{ color:var(--red); }
  .day-date{ font-size:12.5px; color:var(--muted); font-weight:500; }
  .today-tag{ font-size:10.5px; font-weight:650; color:#fff; background:var(--red); border-radius:5px; padding:1px 6px; margin-left:auto; }

  .slot-block{ margin-bottom:4px; }
  .slot-label{ font-size:11.5px; font-weight:650; color:var(--muted); margin:10px 0 4px 2px; }
  .slot-empty{ font-size:13.5px; color:var(--muted); padding:6px 2px; opacity:.7; }

  ul.items{ list-style:none; margin:0; padding:0; }
  li.item{
    display:flex; align-items:flex-start; gap:11px; padding:9px 2px; border-radius:8px;
    transition:opacity .22s ease, transform .22s ease, max-height .22s ease; max-height:160px;
  }
  li.item.removing{ opacity:0; transform:translateX(6px); max-height:0; padding-top:0; padding-bottom:0; overflow:hidden; }
  .check{
    flex-shrink:0; width:19px; height:19px; margin-top:1px; border-radius:50%; border:1.6px solid var(--rule);
    background:var(--paper-raised); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .check svg{ display:none; width:11px; height:11px; stroke:white; }
  .item-text{ flex:1; min-width:0; font-size:16.5px; font-weight:500; line-height:1.4; word-break:break-word; outline:none; padding-top:1px; border-radius:4px; transition:background .12s ease; }
  .item-text:focus{ background:var(--rule-soft); box-shadow:0 0 0 2px var(--rule-soft); }
  .del{ flex-shrink:0; opacity:0; background:none; border:none; cursor:pointer; color:var(--muted); padding:3px; border-radius:6px; }

  /* 이동 / 복사 버튼 (폰에서도 보이도록 항상 표시) */
  .act{
    flex-shrink:0; position:relative; width:26px; height:26px; margin-top:-2px;
    background:none; border:none; cursor:pointer; color:var(--muted); padding:0; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .act svg{ pointer-events:none; }
  .act select{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
    font-size:16px; border:none; background:transparent;
  }


  /* 마우스가 있는 기기에서만 hover 효과 적용 (폰에서는 첫 터치가 hover로 먹혀 두 번 눌러야 하던 문제 방지) */
  @media (hover:hover) and (pointer:fine){
    .overdue-item .del:hover{ background:var(--coral-soft); color:var(--coral); opacity:1; }
    .check:hover{ border-color:var(--red); }
    li.item:hover .del{ opacity:1; }
    .del:hover{ background:var(--coral-soft); color:var(--coral); }
    .act:hover{ background:var(--rule-soft); color:var(--rule); }
  }
  /* 폰: 할일 글씨를 눌러 수정 중일 때 삭제(X) 버튼이 보이게 */
  li.item:focus-within .del{ opacity:1; }
  /* 더블탭 확대 방지 + 탭 반응 즉시 */
  html,body{ touch-action:manipulation; -webkit-text-size-adjust:100%; }
  button,select,.check,.act,.pill,.slot-btn,.chip{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }

  .loading-state{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px; }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(35,42,61,0.38);
    display:none; align-items:flex-end; justify-content:center; z-index:30;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--paper); width:100%; max-width:600px;
    border-radius:18px 18px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:80vh; overflow-y:auto;
  }
  .sheet h3{ font-family:'Noto Serif KR',serif; font-size:18px; font-weight:900; color:var(--red); margin:0 0 14px; }
  .btn{
    flex:1; font-family:inherit; font-size:14px; font-weight:650; padding:12px;
    border-radius:10px; border:none; cursor:pointer;
  }
  .btn.ghost{ background:var(--paper-raised); color:var(--ink-soft); border:1.5px solid var(--line); }
  .sheet-btns{ display:flex; gap:8px; margin-top:18px; }

  .cycle-empty{ font-size:13px; color:var(--muted); padding:16px 2px; text-align:center; }
  .cycle-row{ padding:12px 2px; border-bottom:1px solid var(--line); }
  .cycle-row:last-child{ border-bottom:none; }
  .cycle-top{ display:flex; align-items:flex-start; gap:6px; }
  .cycle-title{ flex:1; min-width:0; font-size:14.5px; font-weight:650; color:var(--ink); margin-bottom:3px; word-break:break-word; }
  .cycle-meta{ font-size:12px; color:var(--ink-soft); }
  .cycle-next{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .cycle-act{
    flex-shrink:0; width:30px; height:30px; margin-top:-4px; background:none; border:none; cursor:pointer;
    color:var(--muted); padding:0; border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .cycle-act.danger{ color:var(--coral); }
  .cycle-act svg{ pointer-events:none; }
  .cycle-edit{ display:flex; gap:6px; align-items:center; }
  .cycle-edit input{
    flex:1; min-width:0; font-family:inherit; font-size:16px; font-weight:500; padding:8px 10px;
    border:1.5px solid var(--red); border-radius:8px; background:var(--paper-raised); color:var(--ink); outline:none;
  }
  .cycle-edit .mini{
    flex-shrink:0; font-family:inherit; font-size:13px; font-weight:650; padding:8px 12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
  }
  .cycle-edit .mini.primary{ background:var(--red); border-color:var(--red); color:#fff; }

  /* 목록 글씨색: 검정=직접 쓴 일회성, 파랑=변동 주기, 빨강=고정(고정일·고정 주기) */
  .k-one{ color:var(--ink); }
  .k-var{ color:var(--k-var); }
  .k-fix{ color:var(--k-fix); }

  /* 설정 화면 */
  .settings{ position:fixed; inset:0; background:var(--paper); z-index:40; display:none; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .settings.show{ display:block; }
  .settings-inner{ max-width:600px; margin:0 auto; padding:calc(24px + env(safe-area-inset-top)) 16px 60px; }
  .set-head{ display:flex; align-items:center; gap:10px; margin-bottom:20px; padding-bottom:14px; border-bottom:3px double var(--rule); }
  .set-head h1{ margin:0; flex:1; }
  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab{
    flex:1; font-family:inherit; font-size:14.5px; font-weight:650; padding:11px 6px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer;
  }
  .tab.on{ background:var(--red); border-color:var(--red); color:#fff; }
  .sec{ font-size:12px; font-weight:650; color:var(--muted); margin:0 0 8px 2px; }
  .flabel{ font-size:11.5px; font-weight:650; color:var(--muted); margin:12px 0 6px 2px; }
  .seg{ display:flex; gap:6px; }
  .seg .slot-btn{ flex:1; text-align:center; }
  .nrow{ display:flex; gap:8px; align-items:center; font-size:14px; font-weight:600; color:var(--ink-soft); }
  .field{
    font-family:inherit; font-size:16px; font-weight:600; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  }
  input.field{ width:96px; }
  .wd{ display:flex; gap:5px; margin-top:8px; }
  .wd button{
    flex:1; font-family:inherit; font-size:14px; font-weight:650; color:var(--ink-soft); background:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:9px 0; cursor:pointer;
  }
  .wd button.on{ background:var(--red); border-color:var(--red); color:#fff; }
  .list-panel{ background:var(--paper-raised); border:1.5px solid var(--line); border-radius:12px; padding:6px 14px; }
  .tip{ font-size:12px; color:var(--muted); margin:12px 2px 0; line-height:1.5; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); font-size:13px; font-weight:500; padding:10px 16px;
    border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>주간 할일</h1>
      <div class="today-line" id="todayLine"></div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="cycleBtn" title="설정" aria-label="설정" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--rule)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
      <div class="sync-dot" id="syncDot"><span class="dot"></span><span id="syncLabel">동기화됨</span></div>
    </div>
  </header>

  <div id="mainContent">
    <div class="loading-state" id="loadingState">불러오는 중…</div>
  </div>
</div>

<div class="settings" id="settings">
  <div class="settings-inner">
    <div class="set-head">
      <button class="icon-btn" id="setBack" type="button" aria-label="돌아가기">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--rule)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <h1>설정</h1>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="fix" type="button">고정 항목</button>
      <button class="tab" data-tab="var" type="button">변동 주기</button>
    </div>

    <div id="tabFix">
      <div class="sec">새 고정 항목 추가</div>
      <div class="add-panel" id="fixForm" style="margin-bottom:22px">
        <input type="text" id="fixName" placeholder="고정 할일 이름 (예: 설거지)" autocomplete="off">
        <div class="flabel">방식</div>
        <div class="seg">
          <button type="button" class="slot-btn selected" data-mode="day">고정일 · 요일로</button>
          <button type="button" class="slot-btn" data-mode="cycle">고정 주기 · 며칠마다</button>
        </div>
        <div id="fxDay">
          <div class="flabel">언제?</div>
          <div class="nrow"><select id="fxWeeks" class="field" aria-label="몇 주마다"></select><span>요일</span></div>
          <div class="wd" id="fxWd"></div>
        </div>
        <div id="fxCycle" hidden>
          <div class="flabel">몇 일마다?</div>
          <div class="nrow"><input type="number" id="fxDays" class="field" inputmode="numeric" min="1" max="365" value="14"><span>일마다 (완료한 날부터 다시 셈)</span></div>
        </div>
        <div class="flabel">시간대 (주말이면 자동으로 '하루')</div>
        <div class="seg">
          <button type="button" class="slot-btn" data-slot="before">출근전</button>
          <button type="button" class="slot-btn selected" data-slot="after">퇴근후</button>
        </div>
        <button class="add-btn" id="fxAdd" type="button">추가</button>
      </div>
      <div class="sec" id="fixListTitle">등록된 고정 항목</div>
      <div class="list-panel" id="fixedList"></div>
      <div class="tip">지우면 앞으로 예약된 일정도 같이 지워져요. 고치고 싶으면 지우고 다시 추가하면 돼요.</div>
    </div>

    <div id="tabVar" hidden>
      <div class="sec">완료 기록으로 주기를 자동 계산하는 항목</div>
      <div class="list-panel"><div id="cycleList"></div></div>
      <div class="tip">목록에서는 파란 글씨로 보여요. 작성 화면에서 "반복되는 일이에요"를 켜고 추가한 일이 여기에 모여요.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const API = '/api/todos';
  const DOW = ['일','월','화','수','목','금','토'];

  let todos = [];
  let history = {}; // { normalizedText: [{date, slot}, ...] } — completion history for recurring detection
  let rules = {};   // { 제목: {type:'day'|'cycle', ...} } — 설정 화면에서 만든 고정 항목 규칙
  let curTab = 'fix', fxMode = 'day', fxWeeks = 1, fxWd = new Date().getDay(), fxSlot = 'after';
  let days = [];
  let currentTodayIso = '';
  let selOffset = 0;
  let selSlot = 'before';
  let selRecurring = false;
  let loaded = false;

  const mainContent = document.getElementById('mainContent');
  const todayLine = document.getElementById('todayLine');
  const toastEl = document.getElementById('toast');
  const syncDot = document.getElementById('syncDot');
  const syncLabel = document.getElementById('syncLabel');

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function toIso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function isoAtOffset(base, offset){ return new Date(base.getFullYear(), base.getMonth(), base.getDate() + offset); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function buildDays(){
    const now = new Date();
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    currentTodayIso = toIso(base);
    days = [];
    for(let i=0;i<7;i++){
      const d = isoAtOffset(base, i);
      const dow = d.getDay();
      days.push({
        iso: toIso(d), dow, isWeekend: dow===0 || dow===6,
        dayName: DOW[dow], dateLabel: (d.getMonth()+1)+'/'+d.getDate(),
        isToday: i===0, offset: i
      });
    }
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }

  function setSync(state){
    syncDot.className = 'sync-dot' + (state==='offline' ? ' offline' : state==='syncing' ? ' syncing' : '');
    syncLabel.textContent = state==='offline' ? '저장 실패 · 재시도 필요' : state==='syncing' ? '저장 중…' : '동기화됨';
  }

  async function loadRemote(){
    const res = await fetch(API, { cache: 'no-store' });
    if(!res.ok) throw new Error('load failed');
    return res.json();
  }

  let saveTimer=null, saveInFlight=false, savePending=false;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 150);
  }
  async function doSave(){
    if(saveInFlight){ savePending = true; return; }
    saveInFlight = true;
    setSync('syncing');
    try{
      const res = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ todos, history, rules })
      });
      if(!res.ok) throw new Error('save failed');
      setSync('ok');
    }catch(e){
      setSync('offline');
      showToast('저장에 실패했어요. 인터넷 연결을 확인해주세요.');
    }finally{
      saveInFlight = false;
      if(savePending){ savePending = false; doSave(); }
    }
  }

  function slotLabel(slot){ if(slot==='before') return '출근전'; if(slot==='after') return '퇴근후'; return '하루'; }

  /* ---------- 주기적 할일 자동 생성 ---------- */
  function normText(s){ return (s||'').trim(); }

  function recordCompletion(text, date, slot){
    const key = normText(text);
    if(!key) return;
    if(!history[key]) history[key] = [];
    history[key].push({ date, slot });
    if(history[key].length > 30) history[key] = history[key].slice(-30); // 무한정 쌓이지 않게 최근 30건만
  }

  function addDaysIso(iso, n){
    const d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate() + Math.floor(n));
    return toIso(d);
  }

  function computeAvgIntervalDays(entries){
    if(entries.length < 2) return null;
    const sorted = entries.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    let total = 0, count = 0;
    for(let i=1;i<sorted.length;i++){
      const d1 = new Date(sorted[i-1].date+'T00:00:00');
      const d2 = new Date(sorted[i].date+'T00:00:00');
      const diff = Math.round((d2-d1)/86400000);
      if(diff > 0){ total += diff; count++; }
    }
    if(count === 0) return null;
    return total / count; // 실행 횟수가 쌓일수록 이 평균이 점점 그 사람 패턴에 맞게 다듬어짐
  }

  // 평균 주기(소수점 포함)를 정수 일수로 바꿈. 소수점은 내림 처리해서 다음 할일이 더 빨리 돌아오게 함. 최소 1일.
  function flooredInterval(avg){ return Math.max(1, Math.floor(avg)); }

  const GEN_HORIZON_DAYS = 90;  // 앞으로 최대 몇 일치까지 미리 만들어둘지
  const GEN_MAX_COUNT = 24;     // 한 항목당 최대 몇 개까지 미리 만들어둘지

  // anchor(마지막 완료일)로부터 interval 간격으로 미래 날짜들을 쭉 뽑아줌
  function desiredSeries(anchorIso, interval){
    const dates = [];
    let cursor = anchorIso;
    const anchorTime = new Date(anchorIso+'T00:00:00').getTime();
    for(let i=0; i<GEN_MAX_COUNT; i++){
      cursor = addDaysIso(cursor, interval);
      const diffFromAnchor = Math.round((new Date(cursor+'T00:00:00').getTime() - anchorTime) / 86400000);
      if(diffFromAnchor > GEN_HORIZON_DAYS) break;
      dates.push(cursor);
    }
    return dates;
  }

  // 완료 기록이 2번 이상 쌓인 항목의 예정 일정을 최신 상태로 맞춤.
  // - 주기(간격)가 바뀌었으면: 이미 만들어둔 예정 일정을 전부 지우고 새 주기로 다시 생성 (자동 수정)
  // - 주기는 그대로인데 예정이 얼마 안 남았으면: 모자란 만큼만 더 채워 넣음 (기존 건 안 건드림)
  // force=true: 방금 완료한 항목처럼 기준일(마지막 완료일)이 바뀐 경우, 주기가 같아도 이후 예정 일정을 전부 지우고 완료일 기준으로 다시 만듦
  function regenerateSeriesFor(key, force){
    const entries = history[key];
    if(!entries || entries.length < 2) return false;
    const avg = computeAvgIntervalDays(entries);
    if(!avg || avg <= 0) return false;
    const interval = flooredInterval(avg);
    const sorted = entries.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const last = sorted[sorted.length-1];

    let existing = todos.filter(t=> t.recurring && normText(t.text)===key);
    const cycleChanged = existing.length>0 && existing.some(t=> t.cycleDays !== interval);

    if(cycleChanged || force){
      todos = todos.filter(t=> !(t.recurring && normText(t.text)===key));
      existing = [];
    }

    if(!cycleChanged && !force && existing.length >= 3) return false; // 주기도 그대로고 예정도 충분히 있음

    const existingDates = new Set(existing.map(t=>t.date));
    const desired = desiredSeries(last.date, interval);
    let added = false;
    desired.forEach(dateIso=>{
      if(existingDates.has(dateIso)) return;
      todos.push({
        id: uid(),
        text: key,
        date: dateIso,
        slot: last.slot || 'before',
        createdAt: Date.now(),
        recurring: true,
        isRecurringType: true,
        cycleDays: interval
      });
      added = true;
    });
    return cycleChanged || !!force || added;
  }

  function autoGenerateRecurring(){
    let changed = false;
    Object.keys(history).forEach(key=>{
      if(regenerateSeriesFor(key)) changed = true;
    });
    return changed;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function allRecurringKeys(){
    const keys = new Set();
    Object.keys(history).forEach(k=> keys.add(k));
    todos.filter(t=>t.isRecurringType).forEach(t=> keys.add(normText(t.text)));
    return [...keys].filter(Boolean);
  }

  function buildCycleList(){
    const wrap = document.getElementById('cycleList');
    const keys = allRecurringKeys().sort((a,b)=> a.localeCompare(b,'ko'));
    if(keys.length===0){
      wrap.innerHTML = '<div class="cycle-empty">아직 반복으로 표시한 할일이 없어요.</div>';
      return;
    }
    wrap.innerHTML = '';
    const PENCIL = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L5.5 13H3v-2.5z"/></svg>';
    const TRASH = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 7v4M9.2 7v4"/></svg>';
    keys.forEach(key=>{
      const entries = history[key] || [];
      const avg = computeAvgIntervalDays(entries);
      const interval = avg ? flooredInterval(avg) : null;
      const upcoming = todos.filter(t=> t.recurring && normText(t.text)===key).map(t=>t.date).sort();

      const row = document.createElement('div');
      row.className = 'cycle-row';
      row.dataset.key = key;

      const top = document.createElement('div');
      top.className = 'cycle-top';
      const title = document.createElement('div');
      title.className = 'cycle-title';
      title.textContent = key;
      const editBtn = document.createElement('button');
      editBtn.type = 'button'; editBtn.className = 'cycle-act js-edit';
      editBtn.setAttribute('aria-label','이름 수정'); editBtn.title = '이름 수정';
      editBtn.innerHTML = PENCIL;
      const delBtn = document.createElement('button');
      delBtn.type = 'button'; delBtn.className = 'cycle-act danger js-del';
      delBtn.setAttribute('aria-label','삭제'); delBtn.title = '삭제';
      delBtn.innerHTML = TRASH;
      top.appendChild(title); top.appendChild(editBtn); top.appendChild(delBtn);
      row.appendChild(top);

      const meta = document.createElement('div');
      meta.className = 'cycle-meta';
      meta.textContent = (interval!==null ? ('주기 '+interval+'일마다') : '완료 기록 부족 · 2번 이상 완료해야 주기가 계산돼요') +
        (entries.length ? (' · 완료 '+entries.length+'번') : '');
      row.appendChild(meta);
      if(upcoming.length){
        const next = document.createElement('div');
        next.className = 'cycle-next';
        next.textContent = '다음 예정 '+dayLabelFor(upcoming[0])+' · 앞으로 '+upcoming.length+'개 예약됨';
        row.appendChild(next);
      }

      editBtn.onclick = ()=> startCycleEdit(row, key);
      delBtn.onclick = ()=>{
        if(!window.confirm('"'+key+'" 반복 항목을 정말 삭제할까요?\n완료 기록과 앞으로 예약된 일정이 함께 지워져요.')) return;
        deleteRecurring(key);
      };
      wrap.appendChild(row);
    });
  }

  // 제목을 입력창으로 바꿔서 수정
  function startCycleEdit(row, key){
    const top = row.querySelector('.cycle-top');
    top.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'cycle-edit';
    const input = document.createElement('input');
    input.type = 'text'; input.value = key; input.id = 'cycleEditInput';
    input.setAttribute('autocomplete','off');
    const save = document.createElement('button');
    save.type = 'button'; save.className = 'mini primary js-save'; save.textContent = '저장';
    const cancel = document.createElement('button');
    cancel.type = 'button'; cancel.className = 'mini js-cancel'; cancel.textContent = '취소';
    save.onclick = ()=> renameRecurring(key, input.value);
    cancel.onclick = ()=> buildCycleList();
    input.onkeydown = (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); renameRecurring(key, input.value); }
      else if(e.key==='Escape'){ buildCycleList(); }
    };
    box.appendChild(input); box.appendChild(save); box.appendChild(cancel);
    top.appendChild(box);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }

  // 반복 항목 이름 바꾸기: 완료 기록 + 모든 할일의 제목을 함께 바꿈.
  // 이미 같은 이름의 항목이 있으면 기록을 합치고(중복 날짜는 한 번만), 주기를 새로 계산해서 예정 일정을 다시 만듦.
  function renameRecurring(oldKey, newName){
    const newKey = normText(newName);
    if(!newKey){ showToast('이름을 입력해주세요'); return; }
    if(newKey === oldKey){ buildCycleList(); return; }
    if(rules[newKey]){ showToast('같은 이름의 고정 항목이 있어요'); return; }

    const merged = Object.prototype.hasOwnProperty.call(history, newKey) ||
      todos.some(t=> t.isRecurringType && normText(t.text)===newKey);

    // 1) 완료 기록 이동/병합
    const moved = history[oldKey] || [];
    const combined = (history[newKey] || []).concat(moved);
    const seen = new Set();
    const uniq = combined
      .slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
      .filter(e=>{ const k = e.date+'|'+e.slot; if(seen.has(k)) return false; seen.add(k); return true; });
    delete history[oldKey];
    if(uniq.length) history[newKey] = uniq.slice(-30);

    // 2) 할일 제목 일괄 변경
    todos.forEach(t=>{ if(normText(t.text)===oldKey) t.text = newKey; });

    // 3) 합쳐진 경우엔 자동 생성 예정 일정을 전부 지우고 새 주기로 다시 만듦 (두 줄기가 겹치지 않게)
    if(merged){
      todos = todos.filter(t=> !(t.recurring && normText(t.text)===newKey));
    }
    regenerateSeriesFor(newKey);

    persist(); renderAll(); buildCycleList();
    showToast(merged ? '같은 이름과 합쳐서 주기를 다시 계산했어요' : '이름을 바꿨어요');
  }

  // 반복 항목 삭제: 완료 기록 + 앞으로 예약된(자동 생성) 일정을 지움.
  // 직접 추가해둔 할일은 지우지 않고 일반 할일로만 바꿔서 남김.
  function deleteRecurring(key){
    delete history[key];
    todos = todos.filter(t=> !(t.recurring && normText(t.text)===key));
    todos.forEach(t=>{ if(normText(t.text)===key && t.isRecurringType) t.isRecurringType = false; });
    persist(); renderAll(); buildCycleList();
    showToast('반복 항목을 삭제했어요');
  }

  /* ---------- 목록 색·순서 ---------- */
  const KIND_RANK = { one:0, var:1, fix:2 };   // 검(일회성) → 파(변동 주기) → 빨(고정)
  function kindOf(t){ return t.fixed ? 'fix' : (t.isRecurringType ? 'var' : 'one'); }
  function kindClass(t){ return 'k-' + kindOf(t); }
  function kindRank(t){ return KIND_RANK[kindOf(t)]; }

  /* ---------- 고정 항목 (설정 화면에서 만듦) ----------
     고정일  : N주마다 요일 — 완료·미룸과 상관없이 늘 그 날짜에 생성
     고정 주기: N일마다 — 완료하면 (적힌 날짜 + N일)로 이후 일정을 전부 다시 만듦. 평균 계산은 안 함 */
  function slotForDate(iso, preferred){
    const w = new Date(iso+'T00:00:00').getDay();
    return (w===0 || w===6) ? 'weekend' : preferred;
  }
  function makeFixedTodo(key, iso, r){
    return { id: uid(), text: key, date: iso, slot: slotForDate(iso, r.slot), createdAt: Date.now(), fixed: true };
  }
  function firstDateOnOrAfter(fromIso, weekday){
    let d = fromIso;
    for(let i=0;i<7;i++){
      if(new Date(d+'T00:00:00').getDay()===weekday) return d;
      d = addDaysIso(d, 1);
    }
    return fromIso;
  }
  // 고정일: 마지막으로 만든 날짜(through) 다음부터 앞으로 90일치까지만 채움 → 완료하거나 지운 날짜는 다시 안 생김
  function genFixedDay(key){
    const r = rules[key];
    if(!r || r.type!=='day') return false;
    const step = 7 * r.weeks;
    const limit = addDaysIso(currentTodayIso, GEN_HORIZON_DAYS);
    let next = r.through ? addDaysIso(r.through, step) : r.start;
    let changed = false, guard = 0;
    while(next <= limit && guard++ < 200){
      if(next >= currentTodayIso) todos.push(makeFixedTodo(key, next, r));   // 지난 날짜는 만들지 않음
      r.through = next;
      changed = true;
      next = addDaysIso(next, step);
    }
    return changed;
  }
  function autoGenerateFixed(){
    let changed = false;
    Object.keys(rules).forEach(key=>{ if(genFixedDay(key)) changed = true; });
    return changed;
  }
  function autoGenerateAll(){
    const a = autoGenerateRecurring();
    const b = autoGenerateFixed();
    return a || b;
  }
  // 고정 주기: 기준일(적힌 날짜)로부터 N일마다 이후 일정을 전부 다시 만듦
  function regenFixedCycle(key, anchorIso){
    const r = rules[key];
    if(!r || r.type!=='cycle') return;
    todos = todos.filter(t=> !(t.fixed && normText(t.text)===key));
    let dates = desiredSeries(anchorIso, r.days);
    if(dates.length===0) dates = [addDaysIso(anchorIso, r.days)];   // 주기가 아주 길어도 다음 일정 1개는 만듦
    dates.forEach(d=> todos.push(makeFixedTodo(key, d, r)));
  }
  function ruleText(r){
    if(r.type==='day'){
      const wk = (r.weekday===0 || r.weekday===6);
      return (r.weeks===1 ? '매주 ' : r.weeks+'주마다 ') + DOW[r.weekday] + '요일 · ' + (wk ? '하루' : slotLabel(r.slot));
    }
    return r.days + '일마다 · ' + slotLabel(r.slot) + ' · 완료한 날부터 다시 셈';
  }

  function addFixed(){
    const input = document.getElementById('fixName');
    const key = normText(input.value);
    if(!key){ showToast('이름을 입력해주세요'); return; }
    if(rules[key]){ showToast('이미 있는 고정 항목이에요'); return; }
    if(allRecurringKeys().indexOf(key) >= 0){ showToast('같은 이름의 변동 주기 항목이 있어요'); return; }
    if(fxMode==='day'){
      rules[key] = { type:'day', weeks:fxWeeks, weekday:fxWd, slot:fxSlot, start:firstDateOnOrAfter(currentTodayIso, fxWd), through:null };
      genFixedDay(key);
    } else {
      const n = parseInt(document.getElementById('fxDays').value, 10);
      if(!(n>=1 && n<=365)){ showToast('1~365일 사이로 입력해주세요'); return; }
      rules[key] = { type:'cycle', days:n, slot:fxSlot };
      todos.push(makeFixedTodo(key, currentTodayIso, rules[key]));   // 첫 할일은 오늘. 완료하면 그날부터 주기를 셈
    }
    input.value = '';
    persist(); renderAll(); buildFixedList();
    showToast('고정 항목을 추가했어요');
  }

  function deleteFixed(key){
    delete rules[key];
    todos = todos.filter(t=> !(t.fixed && normText(t.text)===key));
    persist(); renderAll(); buildFixedList();
    showToast('고정 항목을 삭제했어요');
  }

  function buildFixedList(){
    const wrap = document.getElementById('fixedList');
    const keys = Object.keys(rules).sort((a,b)=> a.localeCompare(b,'ko'));
    document.getElementById('fixListTitle').textContent = '등록된 고정 항목 (' + keys.length + ')';
    wrap.innerHTML = '';
    if(keys.length===0){
      wrap.innerHTML = '<div class="cycle-empty">아직 고정 항목이 없어요.</div>';
      return;
    }
    const TRASH = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 7v4M9.2 7v4"/></svg>';
    keys.forEach(key=>{
      const upcoming = todos.filter(t=> t.fixed && normText(t.text)===key).map(t=>t.date).sort();
      const row = document.createElement('div');
      row.className = 'cycle-row';
      row.dataset.key = key;
      const top = document.createElement('div');
      top.className = 'cycle-top';
      const title = document.createElement('div');
      title.className = 'cycle-title k-fix';
      title.textContent = key;
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'cycle-act danger js-fixdel';
      del.setAttribute('aria-label','삭제'); del.title = '삭제';
      del.innerHTML = TRASH;
      del.onclick = ()=>{
        if(!window.confirm('"'+key+'" 고정 항목을 정말 삭제할까요?\n앞으로 예약된 일정도 함께 지워져요.')) return;
        deleteFixed(key);
      };
      top.appendChild(title); top.appendChild(del);
      row.appendChild(top);
      const meta = document.createElement('div');
      meta.className = 'cycle-meta';
      meta.textContent = ruleText(rules[key]);
      row.appendChild(meta);
      if(upcoming.length){
        const next = document.createElement('div');
        next.className = 'cycle-next';
        next.textContent = '다음 예정 '+dayLabelFor(upcoming[0])+' · 앞으로 '+upcoming.length+'개 예약됨';
        row.appendChild(next);
      }
      wrap.appendChild(row);
    });
  }

  function showTab(tab){
    curTab = tab;
    document.getElementById('tabFix').hidden = tab!=='fix';
    document.getElementById('tabVar').hidden = tab!=='var';
    document.querySelectorAll('#settings .tab').forEach(b=> b.classList.toggle('on', b.dataset.tab===tab));
    if(tab==='fix') buildFixedList(); else buildCycleList();
  }

  function syncFixForm(){
    document.querySelectorAll('#fixForm [data-mode]').forEach(b=> b.classList.toggle('selected', b.dataset.mode===fxMode));
    document.querySelectorAll('#fixForm [data-slot]').forEach(b=> b.classList.toggle('selected', b.dataset.slot===fxSlot));
    document.querySelectorAll('#fxWd button').forEach(b=> b.classList.toggle('on', parseInt(b.dataset.wd,10)===fxWd));
    document.getElementById('fxWeeks').value = String(fxWeeks);
    document.getElementById('fxDay').hidden = fxMode!=='day';
    document.getElementById('fxCycle').hidden = fxMode!=='cycle';
  }

  function setupSettings(){
    const settingsEl = document.getElementById('settings');
    document.getElementById('cycleBtn').onclick = ()=>{ settingsEl.classList.add('show'); showTab(curTab); };
    document.getElementById('setBack').onclick = ()=> settingsEl.classList.remove('show');
    settingsEl.querySelectorAll('.tab').forEach(b=> b.onclick = ()=> showTab(b.dataset.tab));

    const weeksSel = document.getElementById('fxWeeks');
    for(let n=1;n<=8;n++){
      const o = document.createElement('option');
      o.value = String(n); o.textContent = n+'주마다';
      weeksSel.appendChild(o);
    }
    weeksSel.onchange = ()=>{ fxWeeks = parseInt(weeksSel.value,10); };
    const wd = document.getElementById('fxWd');
    for(let i=0;i<7;i++){
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.wd = String(i); b.textContent = DOW[i];
      b.onclick = ()=>{ fxWd = i; syncFixForm(); };
      wd.appendChild(b);
    }
    document.querySelectorAll('#fixForm [data-mode]').forEach(b=> b.onclick = ()=>{ fxMode = b.dataset.mode; syncFixForm(); });
    document.querySelectorAll('#fixForm [data-slot]').forEach(b=> b.onclick = ()=>{ fxSlot = b.dataset.slot; syncFixForm(); });
    document.getElementById('fxAdd').onclick = addFixed;
    document.getElementById('fixName').addEventListener('keydown', e=>{ if(e.key==='Enter') addFixed(); });
    syncFixForm();
  }

  function dayLabelFor(iso){
    const day = days.find(d=>d.iso===iso);
    if(day) return day.dayName+' '+day.dateLabel;
    const d = new Date(iso+'T00:00:00');
    return DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
  }

  function buildLayout(){
    mainContent.innerHTML =
      '<div id="overduePanel"></div>' +
      '<div class="add-panel">' +
        '<input type="text" id="addInput" placeholder="할일을 입력하고 Enter" autocomplete="off">' +
        '<div class="pill-row" id="datePills"></div>' +
        '<div class="slot-row" id="slotRow"></div>' +
        '<button class="recur-toggle" id="recurToggle" type="button">🔁 반복되는 일이에요 (주기 자동 계산)</button>' +
        '<div class="recur-chips" id="recurChips"></div>' +
        '<button class="add-btn" id="addBtn">추가</button>' +
      '</div>' +
      '<div id="daysContainer"></div>';

    const recurBtn = document.getElementById('recurToggle');
    recurBtn.onclick = ()=>{
      selRecurring = !selRecurring;
      recurBtn.classList.toggle('on', selRecurring);
      renderRecurChips();
    };
    document.getElementById('addInput').addEventListener('input', renderRecurChips);
  }

  // 반복 토글을 켜면 기존 반복 목록을 칩으로 보여줌 → 누르면 제목이 그대로 채워져서 오타 걱정 없음
  function renderRecurChips(){
    const box = document.getElementById('recurChips');
    if(!box) return;
    box.classList.toggle('show', selRecurring);
    box.innerHTML = '';
    if(!selRecurring) return;
    const input = document.getElementById('addInput');
    const current = normText(input ? input.value : '');
    const label = document.createElement('div');
    label.className = 'recur-chips-label';
    label.textContent = '기존 반복 목록에서 고르기';
    box.appendChild(label);
    const keys = allRecurringKeys().sort((a,b)=> a.localeCompare(b,'ko'));
    if(keys.length===0){
      const empty = document.createElement('div');
      empty.className = 'chip-empty';
      empty.textContent = '아직 반복 목록이 없어요. 새로 입력하면 돼요.';
      box.appendChild(empty);
      return;
    }
    const wrap = document.createElement('div');
    wrap.className = 'chip-wrap';
    keys.forEach(key=>{
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (key===current ? ' selected' : '');
      chip.textContent = key;
      chip.title = key;
      chip.onclick = ()=>{
        input.value = key;
        renderRecurChips();
        input.focus();
      };
      wrap.appendChild(chip);
    });
    box.appendChild(wrap);
  }

  function renderDatePills(){
    const el = document.getElementById('datePills');
    el.innerHTML = '';
    days.forEach(day=>{
      const btn = document.createElement('button');
      btn.className = 'pill' + (day.isToday?' today':'') + (day.offset===selOffset?' selected':'');
      btn.textContent = day.isToday ? '오늘' : (day.offset===1 ? '내일 · '+day.dateLabel : day.dayName+' '+day.dateLabel);
      btn.onclick = ()=>{
        selOffset = day.offset;
        const d = days[selOffset];
        if(d.isWeekend) selSlot = 'weekend';
        else if(selSlot==='weekend') selSlot = 'before';
        renderDatePills();
        renderSlotRow();
      };
      el.appendChild(btn);
    });
  }

  function renderSlotRow(){
    const el = document.getElementById('slotRow');
    el.innerHTML = '';
    const day = days[selOffset];
    if(day.isWeekend){
      const span = document.createElement('span');
      span.className = 'slot-fixed';
      span.textContent = '주말 · 하루 종일';
      el.appendChild(span);
      selSlot = 'weekend';
    } else {
      ['before','after'].forEach(s=>{
        const btn = document.createElement('button');
        btn.className = 'slot-btn' + (selSlot===s?' selected':'');
        btn.textContent = slotLabel(s);
        btn.onclick = ()=>{ selSlot = s; renderSlotRow(); };
        el.appendChild(btn);
      });
      if(selSlot==='weekend') selSlot = 'before';
    }
  }

  function addTodo(){
    const input = document.getElementById('addInput');
    const text = input.value.trim();
    if(!text) return;
    if(selRecurring && rules[text]){ showToast('고정 항목 이름이에요. 변동 주기로는 쓸 수 없어요'); return; }
    const day = days[selOffset];
    todos.push({
      id: uid(), text, date: day.iso,
      slot: day.isWeekend ? 'weekend' : selSlot,
      createdAt: Date.now(),
      isRecurringType: selRecurring
    });
    input.value = '';
    selRecurring = false;
    const recurBtn = document.getElementById('recurToggle');
    if(recurBtn) recurBtn.classList.remove('on');
    renderRecurChips();
    persist();
    renderAll();
    input.focus();
  }

  function reassignOptions(){
    const opts = ['<option value="">이동할 날짜 선택</option>'];
    days.forEach(day=>{
      if(day.isWeekend){
        opts.push('<option value="'+day.iso+'|weekend">'+(day.isToday?'오늘 · ':'')+day.dayName+' '+day.dateLabel+' · 하루</option>');
      } else {
        opts.push('<option value="'+day.iso+'|before">'+(day.isToday?'오늘 · ':'')+day.dayName+' '+day.dateLabel+' · 출근전</option>');
        opts.push('<option value="'+day.iso+'|after">'+(day.isToday?'오늘 · ':'')+day.dayName+' '+day.dateLabel+' · 퇴근후</option>');
      }
    });
    return opts.join('');
  }

  function renderOverdue(){
    const overduePanel = document.getElementById('overduePanel');
    const overdue = todos.filter(t => t.date < currentTodayIso);
    overduePanel.innerHTML = '';
    if(overdue.length===0) return;

    const panel = document.createElement('div');
    panel.className = 'overdue-panel';
    const title = document.createElement('div');
    title.className = 'overdue-title';
    title.textContent = '놓친 할일 ' + overdue.length + '개 · 날짜를 다시 정해주세요';
    panel.appendChild(title);

    overdue.sort((a,b)=> a.date < b.date ? -1 : 1).forEach(t=>{
      const row = document.createElement('div');
      row.className = 'overdue-item';
      row.id = 'item-'+t.id;

      const textWrap = document.createElement('div');
      textWrap.className = 'overdue-text ' + kindClass(t);
      textWrap.textContent = t.text;
      const meta = document.createElement('span');
      meta.className = 'overdue-meta';
      meta.textContent = dayLabelFor(t.date) + ' · ' + slotLabel(t.slot);
      textWrap.appendChild(meta);

      const select = document.createElement('select');
      select.innerHTML = reassignOptions();
      select.onchange = ()=>{
        if(!select.value) return;
        const [newIso, newSlot] = select.value.split('|');
        t.date = newIso; t.slot = newSlot;
        persist(); renderAll();
        showToast('일정을 옮겼어요');
      };

      const del = document.createElement('button');
      del.className = 'del';
      del.innerHTML = '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3L12 12M12 3L3 12"/></svg>';
      del.onclick = ()=>{ todos = todos.filter(x=>x.id!==t.id); persist(); renderAll(); };

      row.appendChild(textWrap); row.appendChild(select); row.appendChild(del);
      panel.appendChild(row);
    });
    overduePanel.appendChild(panel);
  }

  function completeTodo(id){
    const el = document.getElementById('item-'+id);
    if(el) el.classList.add('removing');
    setTimeout(()=>{
      const t = todos.find(x=>x.id===id);
      const wasRecurring = t && t.isRecurringType;
      if(wasRecurring) recordCompletion(t.text, t.date, t.slot);
      todos = todos.filter(x=>x.id!==id);
      // 늦게/일찍 완료하면 마지막 완료일이 달라지므로, 이후 예정 일정을 완료일 기준으로 전부 다시 맞춤
      if(wasRecurring) regenerateSeriesFor(normText(t.text), true);
      // 고정 주기 항목: 적힌 날짜 기준으로 이후 일정을 다시 맞춤 (고정일은 완료와 상관없으니 그대로)
      if(t && t.fixed) regenFixedCycle(normText(t.text), t.date);
      persist();
      renderAll();
    }, 220);
  }

  function editTodo(id, newText){
    const t = todos.find(x=>x.id===id);
    if(!t) return;
    const clean = newText.trim();
    if(!clean){ todos = todos.filter(x=>x.id!==id); persist(); renderAll(); return; }
    if(t.fixed && normText(clean) !== normText(t.text)){   // 이름을 바꾸면 고정 규칙에서 빠져 일반 할일이 됨
      t.fixed = false;
      const el = document.querySelector('#item-'+id+' .item-text');
      if(el) el.className = 'item-text k-one';
    }
    t.text = clean; persist();
  }

  function makeItemLi(t){
    const li = document.createElement('li');
    li.className = 'item';
    li.id = 'item-'+t.id;

    const check = document.createElement('button');
    check.className = 'check';
    check.setAttribute('aria-label','완료');
    check.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.6 9L10 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    check.onclick = ()=> completeTodo(t.id);

    const textEl = document.createElement('div');
    textEl.className = 'item-text ' + kindClass(t);
    textEl.contentEditable = 'true';
    textEl.spellcheck = false;
    textEl.textContent = t.text;
    textEl.onblur = ()=> editTodo(t.id, textEl.textContent);
    textEl.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); textEl.blur(); } };

    const del = document.createElement('button');
    del.className = 'del';
    del.innerHTML = '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3L12 12M12 3L3 12"/></svg>';
    del.onclick = ()=>{ todos = todos.filter(x=>x.id!==t.id); persist(); renderAll(); };

    li.appendChild(check);
    // 이동 버튼: 누르면 날짜/시간대 고르는 목록이 뜸 (안 보이는 select를 아이콘 위에 겹쳐둠)
    const moveWrap = document.createElement('span');
    moveWrap.className = 'act';
    moveWrap.title = '다른 날/시간으로 이동';
    moveWrap.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.2" width="12" height="10.6" rx="2"/><path d="M2 6.6h12M5.4 1.8v2.4M10.6 1.8v2.4"/></svg>';
    const moveSel = document.createElement('select');
    moveSel.setAttribute('aria-label','다른 날이나 시간으로 이동');
    moveSel.innerHTML = reassignOptions();
    moveSel.onchange = ()=>{
      if(!moveSel.value) return;
      const [newIso, newSlot] = moveSel.value.split('|');
      t.date = newIso; t.slot = newSlot;
      persist(); renderAll();
      showToast('일정을 옮겼어요');
    };
    moveWrap.appendChild(moveSel);

    // 미루기 버튼: 출근전→퇴근후(같은 날), 퇴근후→다음날 출근전으로 한 칸 밀기
    const postponeBtn = document.createElement('button');
    postponeBtn.className = 'act';
    postponeBtn.title = '다음 시간대로 미루기';
    postponeBtn.setAttribute('aria-label','미루기');
    postponeBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l5 5-5 5"/><path d="M8.3 3l5 5-5 5"/></svg>';
    postponeBtn.onclick = ()=> postponeTodo(t.id);

    // 복사 버튼: 바로 다음날에 같은 할일을 추가
    const copyBtn = document.createElement('button');
    copyBtn.className = 'act';
    copyBtn.title = '다음날에도 하기 (복사)';
    copyBtn.setAttribute('aria-label','다음날에 복사');
    copyBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.4" y="5.4" width="8.4" height="8.4" rx="2"/><path d="M10.6 5.4V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4.6a2 2 0 0 0 2 2h1.4"/></svg>';
    copyBtn.onclick = ()=> copyToNextDay(t.id);

    li.appendChild(textEl); li.appendChild(moveWrap); li.appendChild(postponeBtn); li.appendChild(copyBtn); li.appendChild(del);
    return li;
  }

  // 출근전 일정이면 같은 날 퇴근후로, 퇴근후(또는 주말) 일정이면 다음날로 한 칸 밀어줌
  function postponeTodo(id){
    const t = todos.find(x=>x.id===id);
    if(!t) return;
    let newDate = t.date, newSlot;
    if(t.slot === 'before'){
      newSlot = 'after';
    } else {
      newDate = addDaysIso(t.date, 1);
      const nd = new Date(newDate+'T00:00:00');
      const isWeekend = nd.getDay()===0 || nd.getDay()===6;
      newSlot = isWeekend ? 'weekend' : 'before';
    }
    t.date = newDate; t.slot = newSlot;
    persist(); renderAll();
    showToast(dayLabelFor(newDate)+' · '+slotLabel(newSlot)+'로 미뤘어요');
  }

  function copyToNextDay(id){
    const t = todos.find(x=>x.id===id);
    if(!t) return;
    const nextIso = addDaysIso(t.date, 1);
    const nd = new Date(nextIso+'T00:00:00');
    const nextIsWeekend = nd.getDay()===0 || nd.getDay()===6;
    // 다음날이 주말이면 '하루', 평일이면 원래 시간대 유지 (주말→평일이면 출근전)
    const nextSlot = nextIsWeekend ? 'weekend' : (t.slot==='after' ? 'after' : 'before');
    const label = dayLabelFor(nextIso);
    const exists = todos.some(x=> normText(x.text)===normText(t.text) && x.date===nextIso && x.slot===nextSlot);
    if(exists){ showToast(label+'에 이미 있어요'); return; }
    todos.push({
      id: uid(), text: t.text, date: nextIso, slot: nextSlot,
      createdAt: Date.now(),
      isRecurringType: false   // 복사본은 반복 기록에 섞이지 않게 일반 할일로
    });
    persist(); renderAll();
    showToast(label+'에 복사했어요');
  }

  function renderSlotBlock(items, label){
    const wrap = document.createElement('div');
    wrap.className = 'slot-block';
    if(label){
      const lab = document.createElement('div');
      lab.className = 'slot-label';
      lab.textContent = label;
      wrap.appendChild(lab);
    }
    if(items.length===0){
      const empty = document.createElement('div');
      empty.className = 'slot-empty';
      empty.textContent = '없음';
      wrap.appendChild(empty);
    } else {
      const ul = document.createElement('ul');
      ul.className = 'items';
      items.slice().sort((a,b)=> kindRank(a)-kindRank(b)).forEach(t=> ul.appendChild(makeItemLi(t)));  // 검 → 파 → 빨, 같은 색끼리는 원래 순서 유지
      wrap.appendChild(ul);
    }
    return wrap;
  }

  function renderDays(){
    const daysContainer = document.getElementById('daysContainer');
    daysContainer.innerHTML = '';
    days.forEach(day=>{
      const dayTodos = todos.filter(t=> t.date === day.iso);
      const section = document.createElement('div');
      section.className = 'day-section' + (day.isToday?' today':'');

      const header = document.createElement('div');
      header.className = 'day-header';
      const name = document.createElement('span');
      name.className = 'day-name';
      name.textContent = day.dayName+'요일';
      const date = document.createElement('span');
      date.className = 'day-date';
      date.textContent = day.dateLabel;
      header.appendChild(name); header.appendChild(date);
      if(day.isToday){
        const tag = document.createElement('span');
        tag.className = 'today-tag';
        tag.textContent = '오늘';
        header.appendChild(tag);
      }
      section.appendChild(header);

      if(day.isWeekend){
        section.appendChild(renderSlotBlock(dayTodos, null));
      } else {
        section.appendChild(renderSlotBlock(dayTodos.filter(t=>t.slot==='before'), '출근전'));
        section.appendChild(renderSlotBlock(dayTodos.filter(t=>t.slot==='after'), '퇴근후'));
      }
      daysContainer.appendChild(section);
    });
  }

  function renderAll(){
    todayLine.textContent = days[0].dayName+'요일 '+days[0].dateLabel+' 기준 · 오늘부터 7일';
    renderDatePills();
    renderSlotRow();
    renderOverdue();
    renderDays();
    renderRecurChips();
  }

  setupSettings();

  async function init(){
    buildDays();
    try{
      const raw = await loadRemote();
      if(Array.isArray(raw)){ todos = raw; history = {}; rules = {}; } // 예전 형식(배열)과의 호환
      else { todos = raw.todos || []; history = raw.history || {}; rules = raw.rules || {}; }
    }catch(e){
      todos = []; history = {}; rules = {};
      setSync('offline');
      showToast('목록을 불러오지 못했어요. 새로고침해보세요.');
    }
    if(autoGenerateAll()) persist();
    buildLayout();
    document.getElementById('addBtn').addEventListener('click', addTodo);
    document.getElementById('addInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTodo(); });
    renderAll();
    loaded = true;
  }

  setInterval(()=>{
    const now = new Date();
    const iso = toIso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
    if(iso !== currentTodayIso){ buildDays(); if(selOffset>=7) selOffset=0; renderAll(); }
  }, 60000);
  // 화면 확대 차단 (iOS 핀치/더블탭)
  ['gesturestart','gesturechange','gestureend'].forEach(ev=> document.addEventListener(ev, e=> e.preventDefault()));
  document.addEventListener('touchmove', e=>{ if(e.touches && e.touches.length>1) e.preventDefault(); }, {passive:false});

  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible' && loaded){
      const now = new Date();
      const iso = toIso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
      if(iso !== currentTodayIso){ buildDays(); renderAll(); }
      try{
        const raw = await loadRemote();
        if(Array.isArray(raw)){ todos = raw; } else { todos = raw.todos || []; history = raw.history || history; rules = raw.rules || rules; }
        if(autoGenerateAll()) persist();
        renderAll(); setSync('ok');
      }
      catch(e){ setSync('offline'); }
    }
  });

  init();
})();
</script>
</body>
</html>

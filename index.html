<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>주간 할일</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주간 할일">
<meta name="theme-color" content="#FBF3E2">
<link rel="apple-touch-icon" href="/notebook_navy_badge.png">
<link rel="icon" href="/notebook_navy_badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'LeeSeoyun';
    src: url('/LEESEOYUN.TTF') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --paper:#FBF3E2;
    --paper-raised:#FFFDF7;
    --ink:#232A3D;
    --ink-soft:#52597A;
    --muted:#A89A80;
    --line:#E7D9C0;
    --rule:#2C3A66;
    --rule-soft:#E3E7F0;
    --red:#D6492F;
    --red-soft:#F7E1DA;
    --gold:#B9932F;
    --gold-soft:#F6ECD8;
    --coral:#B5533E;
    --coral-soft:#F3E4E0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'LeeSeoyun',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 16px 90px;
  }
  .app{ width:100%; max-width:600px; }

  header{
    margin-bottom:24px; padding-bottom:14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    border-bottom:3px double var(--rule);
  }
  h1{
    font-family:'Noto Serif KR',serif; font-size:27px; font-weight:900; letter-spacing:-0.01em;
    margin:0 0 4px; color:var(--red);
  }
  .today-line{ font-size:13px; color:var(--ink-soft); font-weight:500; }
  .header-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .icon-btn{
    width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .sync-dot{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .sync-dot .dot{ width:6px; height:6px; border-radius:50%; background:var(--rule); }
  .sync-dot.offline .dot{ background:var(--coral); }
  .sync-dot.syncing .dot{ background:var(--gold); }

  .overdue-panel{
    background:var(--gold-soft);
    border:1px solid #E4D6A8;
    border-radius:12px;
    padding:14px 16px 6px;
    margin-bottom:26px;
  }
  .overdue-title{ font-size:13px; font-weight:650; color:#8A6A1E; margin-bottom:8px; }
  .overdue-item{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid #E9DCB2; }
  .overdue-item:first-of-type{ border-top:none; }
  .overdue-text{ flex:1; min-width:0; font-size:14.5px; font-weight:500; line-height:1.4; }
  .overdue-meta{ display:block; font-size:11px; color:#93762C; margin-top:2px; font-weight:500; }
  .overdue-item select{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
    background:var(--paper-raised); border:1px solid var(--line); border-radius:7px;
    padding:6px 8px; max-width:118px; cursor:pointer;
  }
  .overdue-item .del{ flex-shrink:0; background:none; border:none; color:#93762C; cursor:pointer; padding:4px; border-radius:6px; opacity:.7; }
  .overdue-item .del:hover{ background:var(--coral-soft); color:var(--coral); opacity:1; }

  .add-panel{ background:var(--paper-raised); border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:30px; }
  .add-panel input[type=text]{
    width:100%; font-family:inherit; font-size:16px; font-weight:500; padding:11px 4px;
    border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink);
    outline:none; margin-bottom:12px;
  }
  .add-panel input[type=text]::placeholder{ color:var(--muted); font-weight:450; }
  .add-panel input[type=text]:focus{ border-bottom-color:var(--red); }
  .recur-toggle{
    display:block; width:100%; margin-top:10px; font-family:inherit; font-size:12.5px; font-weight:600;
    color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; cursor:pointer; text-align:center;
  }
  .recur-toggle.on{ background:var(--red-soft); border-color:var(--red); color:var(--red); }

  .pill-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar{ display:none; }
  .pill{
    flex-shrink:0; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:7px 11px;
    cursor:pointer; white-space:nowrap; transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .pill.today{ color:var(--red); }
  .pill.selected{ background:var(--red); border-color:var(--red); color:#fff; }

  .slot-row{ display:flex; gap:6px; align-items:center; }
  .slot-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer;
  }
  .slot-btn.selected{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .slot-fixed{ font-size:12.5px; font-weight:600; color:var(--muted); padding:7px 2px; }

  .add-btn{
    display:block; width:100%; margin-top:12px; font-family:inherit; font-size:14px; font-weight:650;
    color:#fff; background:var(--red); border:none; border-radius:8px; padding:11px; cursor:pointer;
  }
  .add-btn:active{ opacity:.85; }
  .add-btn:disabled{ opacity:.5; cursor:default; }

  .day-section{ margin-bottom:22px; }
  .day-header{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px; padding-bottom:6px; border-bottom:1.5px solid var(--rule-soft); }
  .day-section.today .day-header{ border-bottom-color:var(--red); }
  .day-name{ font-family:'Noto Serif KR',serif; font-size:15.5px; font-weight:700; color:var(--rule); }
  .day-section.today .day-name{ color:var(--red); }
  .day-date{ font-size:12.5px; color:var(--muted); font-weight:500; }
  .today-tag{ font-size:10.5px; font-weight:650; color:#fff; background:var(--red); border-radius:5px; padding:1px 6px; margin-left:auto; }

  .slot-block{ margin-bottom:4px; }
  .slot-label{ font-size:11.5px; font-weight:650; color:var(--muted); margin:10px 0 4px 2px; }
  .slot-empty{ font-size:12.5px; color:var(--muted); padding:6px 2px; opacity:.7; }

  ul.items{ list-style:none; margin:0; padding:0; }
  li.item{
    display:flex; align-items:flex-start; gap:11px; padding:9px 2px; border-radius:8px;
    transition:opacity .22s ease, transform .22s ease, max-height .22s ease; max-height:80px;
  }
  li.item.removing{ opacity:0; transform:translateX(6px); max-height:0; padding-top:0; padding-bottom:0; overflow:hidden; }
  .check{
    flex-shrink:0; width:19px; height:19px; margin-top:1px; border-radius:50%; border:1.6px solid var(--rule);
    background:var(--paper-raised); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .check:hover{ border-color:var(--red); }
  .check svg{ display:none; width:11px; height:11px; stroke:white; }
  .item-text{ flex:1; min-width:0; font-size:14.5px; font-weight:500; line-height:1.4; word-break:break-word; outline:none; padding-top:1px; border-radius:4px; transition:background .12s ease; }
  .item-text:focus{ background:var(--rule-soft); box-shadow:0 0 0 2px var(--rule-soft); }
  .del{ flex-shrink:0; opacity:0; background:none; border:none; cursor:pointer; color:var(--muted); padding:3px; border-radius:6px; }
  li.item:hover .del{ opacity:1; }
  .del:hover{ background:var(--coral-soft); color:var(--coral); }

  /* 이동 / 복사 버튼 (폰에서도 보이도록 항상 표시) */
  .act{
    flex-shrink:0; position:relative; width:26px; height:26px; margin-top:-2px;
    background:none; border:none; cursor:pointer; color:var(--muted); padding:0; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .act:hover{ background:var(--rule-soft); color:var(--rule); }
  .act svg{ pointer-events:none; }
  .act select{
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
    font-size:16px; border:none; background:transparent;
  }

  .loading-state{ text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px; }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(35,42,61,0.38);
    display:none; align-items:flex-end; justify-content:center; z-index:30;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--paper); width:100%; max-width:600px;
    border-radius:18px 18px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:80vh; overflow-y:auto;
  }
  .sheet h3{ font-family:'Noto Serif KR',serif; font-size:18px; font-weight:900; color:var(--red); margin:0 0 14px; }
  .btn{
    flex:1; font-family:inherit; font-size:14px; font-weight:650; padding:12px;
    border-radius:10px; border:none; cursor:pointer;
  }
  .btn.ghost{ background:var(--paper-raised); color:var(--ink-soft); border:1.5px solid var(--line); }
  .sheet-btns{ display:flex; gap:8px; margin-top:18px; }

  .cycle-empty{ font-size:13px; color:var(--muted); padding:16px 2px; text-align:center; }
  .cycle-row{ padding:12px 2px; border-bottom:1px solid var(--line); }
  .cycle-row:last-child{ border-bottom:none; }
  .cycle-title{ font-size:14.5px; font-weight:650; color:var(--ink); margin-bottom:3px; }
  .cycle-meta{ font-size:12px; color:var(--ink-soft); }
  .cycle-next{ font-size:11.5px; color:var(--muted); margin-top:3px; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); font-size:13px; font-weight:500; padding:10px 16px;
    border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>주간 할일</h1>
      <div class="today-line" id="todayLine"></div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="cycleBtn" title="반복 주기 보기" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M20 11A8 8 0 1 0 18.3 16" stroke="var(--rule)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M20 5v6h-6" stroke="var(--rule)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="sync-dot" id="syncDot"><span class="dot"></span><span id="syncLabel">동기화됨</span></div>
    </div>
  </header>

  <div id="mainContent">
    <div class="loading-state" id="loadingState">불러오는 중…</div>
  </div>
</div>

<div class="sheet-overlay" id="cycleOverlay">
  <div class="sheet">
    <h3>반복 주기 보기</h3>
    <div id="cycleList"></div>
    <div class="sheet-btns">
      <button class="btn ghost" id="cycleClose" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const API = '/api/todos';
  const DOW = ['일','월','화','수','목','금','토'];

  let todos = [];
  let history = {}; // { normalizedText: [{date, slot}, ...] } — completion history for recurring detection
  let days = [];
  let currentTodayIso = '';
  let selOffset = 0;
  let selSlot = 'before';
  let selRecurring = false;
  let loaded = false;

  const mainContent = document.getElementById('mainContent');
  const todayLine = document.getElementById('todayLine');
  const toastEl = document.getElementById('toast');
  const syncDot = document.getElementById('syncDot');
  const syncLabel = document.getElementById('syncLabel');

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function toIso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function isoAtOffset(base, offset){ return new Date(base.getFullYear(), base.getMonth(), base.getDate() + offset); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function buildDays(){
    const now = new Date();
    const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    currentTodayIso = toIso(base);
    days = [];
    for(let i=0;i<7;i++){
      const d = isoAtOffset(base, i);
      const dow = d.getDay();
      days.push({
        iso: toIso(d), dow, isWeekend: dow===0 || dow===6,
        dayName: DOW[dow], dateLabel: (d.getMonth()+1)+'/'+d.getDate(),
        isToday: i===0, offset: i
      });
    }
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }

  function setSync(state){
    syncDot.className = 'sync-dot' + (state==='offline' ? ' offline' : state==='syncing' ? ' syncing' : '');
    syncLabel.textContent = state==='offline' ? '저장 실패 · 재시도 필요' : state==='syncing' ? '저장 중…' : '동기화됨';
  }

  async function loadRemote(){
    const res = await fetch(API, { cache: 'no-store' });
    if(!res.ok) throw new Error('load failed');
    return res.json();
  }

  let saveTimer=null, saveInFlight=false, savePending=false;
  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 150);
  }
  async function doSave(){
    if(saveInFlight){ savePending = true; return; }
    saveInFlight = true;
    setSync('syncing');
    try{
      const res = await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ todos, history })
      });
      if(!res.ok) throw new Error('save failed');
      setSync('ok');
    }catch(e){
      setSync('offline');
      showToast('저장에 실패했어요. 인터넷 연결을 확인해주세요.');
    }finally{
      saveInFlight = false;
      if(savePending){ savePending = false; doSave(); }
    }
  }

  function slotLabel(slot){ if(slot==='before') return '출근전'; if(slot==='after') return '퇴근후'; return '하루'; }

  /* ---------- 주기적 할일 자동 생성 ---------- */
  function normText(s){ return (s||'').trim(); }

  function recordCompletion(text, date, slot){
    const key = normText(text);
    if(!key) return;
    if(!history[key]) history[key] = [];
    history[key].push({ date, slot });
    if(history[key].length > 30) history[key] = history[key].slice(-30); // 무한정 쌓이지 않게 최근 30건만
  }

  function addDaysIso(iso, n){
    const d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate() + Math.floor(n));
    return toIso(d);
  }

  function computeAvgIntervalDays(entries){
    if(entries.length < 2) return null;
    const sorted = entries.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    let total = 0, count = 0;
    for(let i=1;i<sorted.length;i++){
      const d1 = new Date(sorted[i-1].date+'T00:00:00');
      const d2 = new Date(sorted[i].date+'T00:00:00');
      const diff = Math.round((d2-d1)/86400000);
      if(diff > 0){ total += diff; count++; }
    }
    if(count === 0) return null;
    return total / count; // 실행 횟수가 쌓일수록 이 평균이 점점 그 사람 패턴에 맞게 다듬어짐
  }

  // 평균 주기(소수점 포함)를 정수 일수로 바꿈. 소수점은 내림 처리해서 다음 할일이 더 빨리 돌아오게 함. 최소 1일.
  function flooredInterval(avg){ return Math.max(1, Math.floor(avg)); }

  const GEN_HORIZON_DAYS = 90;  // 앞으로 최대 몇 일치까지 미리 만들어둘지
  const GEN_MAX_COUNT = 24;     // 한 항목당 최대 몇 개까지 미리 만들어둘지

  // anchor(마지막 완료일)로부터 interval 간격으로 미래 날짜들을 쭉 뽑아줌
  function desiredSeries(anchorIso, interval){
    const dates = [];
    let cursor = anchorIso;
    const anchorTime = new Date(anchorIso+'T00:00:00').getTime();
    for(let i=0; i<GEN_MAX_COUNT; i++){
      cursor = addDaysIso(cursor, interval);
      const diffFromAnchor = Math.round((new Date(cursor+'T00:00:00').getTime() - anchorTime) / 86400000);
      if(diffFromAnchor > GEN_HORIZON_DAYS) break;
      dates.push(cursor);
    }
    return dates;
  }

  // 완료 기록이 2번 이상 쌓인 항목의 예정 일정을 최신 상태로 맞춤.
  // - 주기(간격)가 바뀌었으면: 이미 만들어둔 예정 일정을 전부 지우고 새 주기로 다시 생성 (자동 수정)
  // - 주기는 그대로인데 예정이 얼마 안 남았으면: 모자란 만큼만 더 채워 넣음 (기존 건 안 건드림)
  function regenerateSeriesFor(key){
    const entries = history[key];
    if(!entries || entries.length < 2) return false;
    const avg = computeAvgIntervalDays(entries);
    if(!avg || avg <= 0) return false;
    const interval = flooredInterval(avg);
    const sorted = entries.slice().sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const last = sorted[sorted.length-1];

    let existing = todos.filter(t=> t.recurring && normText(t.text)===key);
    const cycleChanged = existing.length>0 && existing.some(t=> t.cycleDays !== interval);

    if(cycleChanged){
      todos = todos.filter(t=> !(t.recurring && normText(t.text)===key));
      existing = [];
    }

    if(!cycleChanged && existing.length >= 3) return false; // 주기도 그대로고 예정도 충분히 있음

    const existingDates = new Set(existing.map(t=>t.date));
    const desired = desiredSeries(last.date, interval);
    let added = false;
    desired.forEach(dateIso=>{
      if(existingDates.has(dateIso)) return;
      todos.push({
        id: uid(),
        text: key,
        date: dateIso,
        slot: last.slot || 'before',
        createdAt: Date.now(),
        recurring: true,
        isRecurringType: true,
        cycleDays: interval
      });
      added = true;
    });
    return cycleChanged || added;
  }

  function autoGenerateRecurring(){
    let changed = false;
    Object.keys(history).forEach(key=>{
      if(regenerateSeriesFor(key)) changed = true;
    });
    return changed;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function allRecurringKeys(){
    const keys = new Set();
    Object.keys(history).forEach(k=> keys.add(k));
    todos.filter(t=>t.isRecurringType).forEach(t=> keys.add(normText(t.text)));
    return [...keys].filter(Boolean);
  }

  function buildCycleList(){
    const wrap = document.getElementById('cycleList');
    const keys = allRecurringKeys().sort((a,b)=> a.localeCompare(b,'ko'));
    if(keys.length===0){
      wrap.innerHTML = '<div class="cycle-empty">아직 반복으로 표시한 할일이 없어요.</div>';
      return;
    }
    let html = '';
    keys.forEach(key=>{
      const entries = history[key] || [];
      const avg = computeAvgIntervalDays(entries);
      const interval = avg ? flooredInterval(avg) : null;
      const upcoming = todos.filter(t=> t.recurring && normText(t.text)===key).map(t=>t.date).sort();
      html += '<div class="cycle-row">' +
        '<div class="cycle-title">'+escapeHtml(key)+'</div>' +
        '<div class="cycle-meta">' +
          (interval!==null ? ('주기 '+interval+'일마다') : '완료 기록 부족 · 2번 이상 완료해야 주기가 계산돼요') +
          (entries.length ? (' · 완료 '+entries.length+'번') : '') +
        '</div>' +
        (upcoming.length
          ? ('<div class="cycle-next">다음 예정 '+dayLabelFor(upcoming[0])+' · 앞으로 '+upcoming.length+'개 예약됨</div>')
          : '') +
      '</div>';
    });
    wrap.innerHTML = html;
  }

  function dayLabelFor(iso){
    const day = days.find(d=>d.iso===iso);
    if(day) return day.dayName+' '+day.dateLabel;
    const d = new Date(iso+'T00:00:00');
    return DOW[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
  }

  function buildLayout(){
    mainContent.innerHTML =
      '<div id="overduePanel"></div>' +
      '<div class="add-panel">' +
        '<input type="text" id="addInput" placeholder="할일을 입력하고 Enter" autocomplete="off">' +
        '<div class="pill-row" id="datePills"></div>' +
        '<div class="slot-row" id="slotRow"></div>' +
        '<button class="recur-toggle" id="recurToggle" type="button">🔁 반복되는 일이에요</button>' +
        '<button class="add-btn" id="addBtn">추가</button>' +
      '</div>' +
      '<div id="daysContainer"></div>';

    const recurBtn = document.getElementById('recurToggle');
    recurBtn.onclick = ()=>{
      selRecurring = !selRecurring;
      recurBtn.classList.toggle('on', selRecurring);
    };
  }

  function renderDatePills(){
    const el = document.getElementById('datePills');
    el.innerHTML = '';
    days.forEach(day=>{
      const btn = document.createElement('button');
      btn.className = 'pill' + (day.isToday?' today':'') + (day.offset===selOffset?' selected':'');
      btn.textContent = day.isToday ? '오늘' : (day.offset===1 ? '내일 · '+day.dateLabel : day.dayName+' '+day.dateLabel);
      btn.onclick = ()=>{
        selOffset = day.offset;
        const d = days[selOffset];
        if(d.isWeekend) selSlot = 'weekend';
        else if(selSlot==='weekend') selSlot = 'before';
        renderDatePills();
        renderSlotRow();
      };
      el.appendChild(btn);
    });
  }

  function renderSlotRow(){
    const el = document.getElementById('slotRow');
    el.innerHTML = '';
    const day = days[selOffset];
    if(day.isWeekend){
      const span = document.createElement('span');
      span.className = 'slot-fixed';
      span.textContent = '주말 · 하루 종일';
      el.appendChild(span);
      selSlot = 'weekend';
    } else {
      ['before','after'].forEach(s=>{
        const btn = document.createElement('button');
        btn.className = 'slot-btn' + (selSlot===s?' selected':'');
        btn.textContent = slotLabel(s);
        btn.onclick = ()=>{ selSlot = s; renderSlotRow(); };
        el.appendChild(btn);
      });
      if(selSlot==='weekend') selSlot = 'before';
    }
  }

  function addTodo(){
    const input = document.getElementById('addInput');
    const text = input.value.trim();
    if(!text) return;
    const day = days[selOffset];
    todos.push({
      id: uid(), text, date: day.iso,
      slot: day.isWeekend ? 'weekend' : selSlot,
      createdAt: Date.now(),
      isRecurringType: selRecurring
    });
    input.value = '';
    selRecurring = false;
    const recurBtn = document.getElementById('recurToggle');
    if(recurBtn) recurBtn.classList.remove('on');
    persist();
    renderAll();
    input.focus();
  }

  function reassignOptions(){
    const opts = ['<option value="">이동할 날짜 선택</option>'];
    days.forEach(day=>{
      if(day.isWeekend){
        opts.push('<option value="'+day.iso+'|weekend">'+(day.isToday?'오늘 · ':'')+day.dayName+' '+day.dateLabel+' · 하루</option>');
      } else {
        opts.push('<option value="'+day.iso+'|before">'+(day.isToday?'오늘 · ':'')+day.dayName+' '+day.dateLabel+' · 출근전</option>');
        opts.push('<option value="'+day.iso+'|after">'+(day.isToday?'오늘 · ':'')+day.dayName+' '+day.dateLabel+' · 퇴근후</option>');
      }
    });
    return opts.join('');
  }

  function renderOverdue(){
    const overduePanel = document.getElementById('overduePanel');
    const overdue = todos.filter(t => t.date < currentTodayIso);
    overduePanel.innerHTML = '';
    if(overdue.length===0) return;

    const panel = document.createElement('div');
    panel.className = 'overdue-panel';
    const title = document.createElement('div');
    title.className = 'overdue-title';
    title.textContent = '놓친 할일 ' + overdue.length + '개 · 날짜를 다시 정해주세요';
    panel.appendChild(title);

    overdue.sort((a,b)=> a.date < b.date ? -1 : 1).forEach(t=>{
      const row = document.createElement('div');
      row.className = 'overdue-item';
      row.id = 'item-'+t.id;

      const textWrap = document.createElement('div');
      textWrap.className = 'overdue-text';
      textWrap.textContent = t.text;
      const meta = document.createElement('span');
      meta.className = 'overdue-meta';
      meta.textContent = dayLabelFor(t.date) + ' · ' + slotLabel(t.slot);
      textWrap.appendChild(meta);

      const select = document.createElement('select');
      select.innerHTML = reassignOptions();
      select.onchange = ()=>{
        if(!select.value) return;
        const [newIso, newSlot] = select.value.split('|');
        t.date = newIso; t.slot = newSlot;
        persist(); renderAll();
        showToast('일정을 옮겼어요');
      };

      const del = document.createElement('button');
      del.className = 'del';
      del.innerHTML = '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3L12 12M12 3L3 12"/></svg>';
      del.onclick = ()=>{ todos = todos.filter(x=>x.id!==t.id); persist(); renderAll(); };

      row.appendChild(textWrap); row.appendChild(select); row.appendChild(del);
      panel.appendChild(row);
    });
    overduePanel.appendChild(panel);
  }

  function completeTodo(id){
    const el = document.getElementById('item-'+id);
    if(el) el.classList.add('removing');
    setTimeout(()=>{
      const t = todos.find(x=>x.id===id);
      const wasRecurring = t && t.isRecurringType;
      if(wasRecurring) recordCompletion(t.text, t.date, t.slot);
      todos = todos.filter(x=>x.id!==id);
      if(wasRecurring) autoGenerateRecurring();
      persist();
      renderAll();
    }, 220);
  }

  function editTodo(id, newText){
    const t = todos.find(x=>x.id===id);
    if(!t) return;
    const clean = newText.trim();
    if(!clean){ todos = todos.filter(x=>x.id!==id); persist(); renderAll(); return; }
    t.text = clean; persist();
  }

  function makeItemLi(t){
    const li = document.createElement('li');
    li.className = 'item';
    li.id = 'item-'+t.id;

    const check = document.createElement('button');
    check.className = 'check';
    check.setAttribute('aria-label','완료');
    check.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.6 9L10 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    check.onclick = ()=> completeTodo(t.id);

    const textEl = document.createElement('div');
    textEl.className = 'item-text';
    textEl.contentEditable = 'true';
    textEl.spellcheck = false;
    textEl.textContent = t.text;
    textEl.onblur = ()=> editTodo(t.id, textEl.textContent);
    textEl.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); textEl.blur(); } };

    const del = document.createElement('button');
    del.className = 'del';
    del.innerHTML = '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3L12 12M12 3L3 12"/></svg>';
    del.onclick = ()=>{ todos = todos.filter(x=>x.id!==t.id); persist(); renderAll(); };

    li.appendChild(check);
    if(t.recurring){
      const badge = document.createElement('span');
      badge.textContent = '🔁';
      badge.title = '완료 기록을 바탕으로 자동 생성된 할일이에요';
      badge.style.cssText = 'font-size:12px; margin-top:2px; flex-shrink:0;';
      li.appendChild(badge);
    } else if(t.isRecurringType){
      const badge = document.createElement('span');
      badge.textContent = '🔁';
      badge.title = '반복 할일로 표시됨 · 완료 기록이 쌓이면 주기를 계산해 자동으로 다음 할일이 생겨요';
      badge.style.cssText = 'font-size:12px; margin-top:2px; flex-shrink:0; opacity:0.45;';
      li.appendChild(badge);
    }
    // 이동 버튼: 누르면 날짜/시간대 고르는 목록이 뜸 (안 보이는 select를 아이콘 위에 겹쳐둠)
    const moveWrap = document.createElement('span');
    moveWrap.className = 'act';
    moveWrap.title = '다른 날/시간으로 이동';
    moveWrap.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3.2" width="12" height="10.6" rx="2"/><path d="M2 6.6h12M5.4 1.8v2.4M10.6 1.8v2.4"/></svg>';
    const moveSel = document.createElement('select');
    moveSel.setAttribute('aria-label','다른 날이나 시간으로 이동');
    moveSel.innerHTML = reassignOptions();
    moveSel.onchange = ()=>{
      if(!moveSel.value) return;
      const [newIso, newSlot] = moveSel.value.split('|');
      t.date = newIso; t.slot = newSlot;
      persist(); renderAll();
      showToast('일정을 옮겼어요');
    };
    moveWrap.appendChild(moveSel);

    // 미루기 버튼: 출근전→퇴근후(같은 날), 퇴근후→다음날 출근전으로 한 칸 밀기
    const postponeBtn = document.createElement('button');
    postponeBtn.className = 'act';
    postponeBtn.title = '다음 시간대로 미루기';
    postponeBtn.setAttribute('aria-label','미루기');
    postponeBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l5 5-5 5"/><path d="M8.3 3l5 5-5 5"/></svg>';
    postponeBtn.onclick = ()=> postponeTodo(t.id);

    // 복사 버튼: 바로 다음날에 같은 할일을 추가
    const copyBtn = document.createElement('button');
    copyBtn.className = 'act';
    copyBtn.title = '다음날에도 하기 (복사)';
    copyBtn.setAttribute('aria-label','다음날에 복사');
    copyBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.4" y="5.4" width="8.4" height="8.4" rx="2"/><path d="M10.6 5.4V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4.6a2 2 0 0 0 2 2h1.4"/></svg>';
    copyBtn.onclick = ()=> copyToNextDay(t.id);

    li.appendChild(textEl); li.appendChild(moveWrap); li.appendChild(postponeBtn); li.appendChild(copyBtn); li.appendChild(del);
    return li;
  }

  // 출근전 일정이면 같은 날 퇴근후로, 퇴근후(또는 주말) 일정이면 다음날로 한 칸 밀어줌
  function postponeTodo(id){
    const t = todos.find(x=>x.id===id);
    if(!t) return;
    let newDate = t.date, newSlot;
    if(t.slot === 'before'){
      newSlot = 'after';
    } else {
      newDate = addDaysIso(t.date, 1);
      const nd = new Date(newDate+'T00:00:00');
      const isWeekend = nd.getDay()===0 || nd.getDay()===6;
      newSlot = isWeekend ? 'weekend' : 'before';
    }
    t.date = newDate; t.slot = newSlot;
    persist(); renderAll();
    showToast(dayLabelFor(newDate)+' · '+slotLabel(newSlot)+'로 미뤘어요');
  }

  function copyToNextDay(id){
    const t = todos.find(x=>x.id===id);
    if(!t) return;
    const nextIso = addDaysIso(t.date, 1);
    const nd = new Date(nextIso+'T00:00:00');
    const nextIsWeekend = nd.getDay()===0 || nd.getDay()===6;
    // 다음날이 주말이면 '하루', 평일이면 원래 시간대 유지 (주말→평일이면 출근전)
    const nextSlot = nextIsWeekend ? 'weekend' : (t.slot==='after' ? 'after' : 'before');
    const label = dayLabelFor(nextIso);
    const exists = todos.some(x=> normText(x.text)===normText(t.text) && x.date===nextIso && x.slot===nextSlot);
    if(exists){ showToast(label+'에 이미 있어요'); return; }
    todos.push({
      id: uid(), text: t.text, date: nextIso, slot: nextSlot,
      createdAt: Date.now(),
      isRecurringType: false   // 복사본은 반복 기록에 섞이지 않게 일반 할일로
    });
    persist(); renderAll();
    showToast(label+'에 복사했어요');
  }

  function renderSlotBlock(items, label){
    const wrap = document.createElement('div');
    wrap.className = 'slot-block';
    if(label){
      const lab = document.createElement('div');
      lab.className = 'slot-label';
      lab.textContent = label;
      wrap.appendChild(lab);
    }
    if(items.length===0){
      const empty = document.createElement('div');
      empty.className = 'slot-empty';
      empty.textContent = '없음';
      wrap.appendChild(empty);
    } else {
      const ul = document.createElement('ul');
      ul.className = 'items';
      items.forEach(t=> ul.appendChild(makeItemLi(t)));
      wrap.appendChild(ul);
    }
    return wrap;
  }

  function renderDays(){
    const daysContainer = document.getElementById('daysContainer');
    daysContainer.innerHTML = '';
    days.forEach(day=>{
      const dayTodos = todos.filter(t=> t.date === day.iso);
      const section = document.createElement('div');
      section.className = 'day-section' + (day.isToday?' today':'');

      const header = document.createElement('div');
      header.className = 'day-header';
      const name = document.createElement('span');
      name.className = 'day-name';
      name.textContent = day.dayName+'요일';
      const date = document.createElement('span');
      date.className = 'day-date';
      date.textContent = day.dateLabel;
      header.appendChild(name); header.appendChild(date);
      if(day.isToday){
        const tag = document.createElement('span');
        tag.className = 'today-tag';
        tag.textContent = '오늘';
        header.appendChild(tag);
      }
      section.appendChild(header);

      if(day.isWeekend){
        section.appendChild(renderSlotBlock(dayTodos, null));
      } else {
        section.appendChild(renderSlotBlock(dayTodos.filter(t=>t.slot==='before'), '출근전'));
        section.appendChild(renderSlotBlock(dayTodos.filter(t=>t.slot==='after'), '퇴근후'));
      }
      daysContainer.appendChild(section);
    });
  }

  function renderAll(){
    todayLine.textContent = days[0].dayName+'요일 '+days[0].dateLabel+' 기준 · 오늘부터 7일';
    renderDatePills();
    renderSlotRow();
    renderOverdue();
    renderDays();
  }

  document.getElementById('cycleBtn').onclick = ()=>{
    buildCycleList();
    document.getElementById('cycleOverlay').classList.add('show');
  };
  document.getElementById('cycleClose').onclick = ()=>{
    document.getElementById('cycleOverlay').classList.remove('show');
  };
  document.getElementById('cycleOverlay').onclick = (e)=>{
    if(e.target.id==='cycleOverlay') e.currentTarget.classList.remove('show');
  };

  async function init(){
    buildDays();
    try{
      const raw = await loadRemote();
      if(Array.isArray(raw)){ todos = raw; history = {}; } // 예전 형식(배열)과의 호환
      else { todos = raw.todos || []; history = raw.history || {}; }
    }catch(e){
      todos = []; history = {};
      setSync('offline');
      showToast('목록을 불러오지 못했어요. 새로고침해보세요.');
    }
    if(autoGenerateRecurring()) persist();
    buildLayout();
    document.getElementById('addBtn').addEventListener('click', addTodo);
    document.getElementById('addInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTodo(); });
    renderAll();
    loaded = true;
  }

  setInterval(()=>{
    const now = new Date();
    const iso = toIso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
    if(iso !== currentTodayIso){ buildDays(); if(selOffset>=7) selOffset=0; renderAll(); }
  }, 60000);
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState==='visible' && loaded){
      const now = new Date();
      const iso = toIso(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
      if(iso !== currentTodayIso){ buildDays(); renderAll(); }
      try{
        const raw = await loadRemote();
        if(Array.isArray(raw)){ todos = raw; } else { todos = raw.todos || []; history = raw.history || history; }
        if(autoGenerateRecurring()) persist();
        renderAll(); setSync('ok');
      }
      catch(e){ setSync('offline'); }
    }
  });

  init();
})();
</script>
</body>
</html>
